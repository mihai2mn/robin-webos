<!doctype html>
<!-- Calls the asynchronous browser features bot checks (e.g. Cloudflare's) use, each with a 5 s timeout, and reports
     ok / error / TIMEOUT to the report file of tools/eme-test/minihttpd (/log?...). A feature that never answers
     leaves such a check spinning. Open http://127.0.0.1:8099/async.html in Wren. -->
<html><head><meta charset="utf-8"><title>Async features</title></head><body><pre id="o"></pre><script>
function log(m) { document.getElementById('o').textContent += m + '\n'; try { new Image().src = '/log?' + encodeURIComponent(m); } catch (e) {} }
function str(v) { try { return typeof v === 'string' ? v : JSON.stringify(v); } catch (e) { return String(v); } }
function test(name, f) {
  const t0 = performance.now();
  let p;
  try { p = Promise.resolve(f()); } catch (e) { p = Promise.reject(e); }
  const timeout = new Promise((res) => setTimeout(() => res('TIMEOUT'), 5000));
  return Promise.race([p.then((v) => 'ok ' + str(v).slice(0, 120), (e) => 'error ' + (e && e.name) + ': ' + (e && e.message)), timeout])
    .then((r) => log(name + ' | ' + r + ' | ' + Math.round(performance.now() - t0) + ' ms'));
}
const wasm = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 7, 1, 96, 2, 127, 127, 1, 127, 3, 2, 1, 0, 7, 7, 1, 3, 97, 100, 100, 0, 0, 10, 9, 1, 7, 0, 32, 0, 32, 1, 106, 11]);
const tests = [
  ['raf', () => new Promise((r) => requestAnimationFrame(() => r('fired')))],
  ['setTimeout0', () => new Promise((r) => setTimeout(() => r('fired'), 0))],
  ['messageChannel', () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r('fired'); c.port2.postMessage(1); })],
  ['postMessageSelf', () => new Promise((r) => { addEventListener('message', function h(e) { if (e.data === 'probe') { removeEventListener('message', h); r('fired'); } }); postMessage('probe', '*'); })],
  ['requestIdleCallback', () => typeof requestIdleCallback === 'function' ? new Promise((r) => requestIdleCallback(() => r('fired'))) : 'absent'],
  ['worker', () => new Promise((r, j) => { const w = new Worker(URL.createObjectURL(new Blob(['onmessage=e=>postMessage(e.data*2)']))); w.onmessage = (e) => r(e.data); w.onerror = (e) => j(new Error(e.message)); w.postMessage(21); })],
  ['workerOffscreenCanvas', () => new Promise((r, j) => { const w = new Worker(URL.createObjectURL(new Blob(['onmessage=()=>{try{const c=new OffscreenCanvas(16,16);const g=c.getContext("2d");g.fillRect(0,0,4,4);postMessage(typeof c.convertToBlob)}catch(e){postMessage("err "+e)}}']))); w.onmessage = (e) => r(e.data); w.onerror = (e) => j(new Error(e.message)); w.postMessage(0); })],
  ['wasmInstantiate', () => WebAssembly.instantiate(wasm).then((m) => m.instance.exports.add(2, 3))],
  ['subtleDigest', () => crypto.subtle.digest('SHA-256', new Uint8Array([1, 2, 3])).then((b) => b.byteLength)],
  ['subtleGenerateKey', () => crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']).then(() => 'key')],
  ['canvasToDataURL', () => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); g.fillText('x', 4, 20); return c.toDataURL().length; }],
  ['canvasToBlob', () => new Promise((r) => { const c = document.createElement('canvas'); c.width = c.height = 32; c.toBlob((b) => r(b && b.size)); })],
  ['createImageBitmap', () => { const c = document.createElement('canvas'); c.width = c.height = 8; return createImageBitmap(c).then((b) => b.width); }],
  ['webglReadPixels', () => { const c = document.createElement('canvas'); const g = c.getContext('webgl'); if (!g) return 'no webgl'; g.clearColor(1, 0, 0, 1); g.clear(g.COLOR_BUFFER_BIT); const p = new Uint8Array(4); g.readPixels(0, 0, 1, 1, g.RGBA, g.UNSIGNED_BYTE, p); return Array.from(p); }],
  ['offlineAudio', () => { const A = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!A) return 'absent'; const a = new A(1, 5000, 44100); const o = a.createOscillator(); const k = a.createDynamicsCompressor(); o.connect(k); k.connect(a.destination); o.start(0); return a.startRendering().then((b) => b.getChannelData(0).slice(4500, 4505).reduce((s, x) => s + Math.abs(x), 0)); }],
  ['audioContextState', () => { const A = window.AudioContext || window.webkitAudioContext; if (!A) return 'absent'; const a = new A(); const s = a.state + ' ' + a.sampleRate; return a.close().then(() => s); }],
  ['permissionsNotifications', () => navigator.permissions ? navigator.permissions.query({ name: 'notifications' }).then((p) => p.state) : 'absent'],
  ['permissionsGeolocation', () => navigator.permissions ? navigator.permissions.query({ name: 'geolocation' }).then((p) => p.state) : 'absent'],
  ['enumerateDevices', () => navigator.mediaDevices ? navigator.mediaDevices.enumerateDevices().then((d) => d.length) : 'absent'],
  ['rtcCreateOffer', () => { if (!window.RTCPeerConnection) return 'absent'; const pc = new RTCPeerConnection(); pc.createDataChannel('x'); return pc.createOffer().then((o) => { pc.close(); return o.sdp.length; }); }],
  ['rtcIceGathering', () => { if (!window.RTCPeerConnection) return 'absent'; return new Promise((r, j) => { const pc = new RTCPeerConnection(); pc.createDataChannel('x'); pc.onicecandidate = (e) => { if (!e.candidate) { pc.close(); r('complete'); } }; pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(j); }); }],
  ['speechVoices', () => window.speechSynthesis ? speechSynthesis.getVoices().length : 'absent'],
  ['storageEstimate', () => navigator.storage && navigator.storage.estimate ? navigator.storage.estimate().then((e) => e.quota > 0) : 'absent'],
  ['indexedDB', () => new Promise((r, j) => { const q = indexedDB.open('probe'); q.onsuccess = () => { q.result.close(); r('open'); }; q.onerror = () => j(q.error); })],
  ['cacheStorage', () => window.caches ? caches.open('probe').then(() => 'open') : 'absent'],
  ['fontsReady', () => document.fonts.ready.then(() => document.fonts.status)],
  ['mediaCapabilities', () => navigator.mediaCapabilities.decodingInfo({ type: 'file', video: { contentType: 'video/mp4; codecs="avc1.42E01E"', width: 640, height: 360, bitrate: 1e6, framerate: 30 } }).then((i) => i.supported)],
  ['fetchSameOrigin', () => fetch(location.href, { cache: 'no-store' }).then((r) => r.status)],
  ['crossOriginFrame', () => new Promise((r) => { const f = document.createElement('iframe'); f.src = 'https://example.com/'; f.onload = () => r('loaded'); document.body.appendChild(f); })],
  ['serviceWorker', () => 'serviceWorker' in navigator ? 'present' : 'absent'],
  ['sharedArrayBuffer', () => typeof SharedArrayBuffer],
  ['crossOriginIsolated', () => self.crossOriginIsolated],
];
log('ua ' + navigator.userAgent);
(async () => { for (const [n, f] of tests) await test(n, f); log('ended'); })();
</script></body></html>
