<!doctype html>
<!-- Lists the browser signals bot checks (e.g. Cloudflare's) look at, to the report file of tools/eme-test/minihttpd.
     Open http://127.0.0.1:8099/probe.html in Wren. -->
<html><head><meta charset="utf-8"><title>Signals</title></head><body><pre id="o"></pre><script>
function log(m){ document.getElementById('o').textContent += m + '\n'; try{ new Image().src='/log?'+encodeURIComponent(m); }catch(e){} }
var n = navigator, r = [];
function add(k, f){ try { r.push(k + '=' + JSON.stringify(f())); } catch (e) { r.push(k + '=ERR ' + e); } }
add('ua', function(){ return n.userAgent; });
add('platform', function(){ return n.platform; });
add('vendor', function(){ return n.vendor; });
add('webdriver', function(){ return n.webdriver; });
add('languages', function(){ return n.languages; });
add('cores', function(){ return n.hardwareConcurrency; });
add('memory', function(){ return n.deviceMemory; });
add('plugins', function(){ return n.plugins.length; });
add('mimeTypes', function(){ return n.mimeTypes.length; });
add('pdfViewerEnabled', function(){ return n.pdfViewerEnabled; });
add('cookieEnabled', function(){ return n.cookieEnabled; });
add('maxTouchPoints', function(){ return n.maxTouchPoints; });
add('screen', function(){ return [screen.width, screen.height, screen.colorDepth, devicePixelRatio, innerWidth, innerHeight, outerWidth, outerHeight]; });
add('tz', function(){ return Intl.DateTimeFormat().resolvedOptions().timeZone + ' ' + new Date().getTimezoneOffset(); });
add('workers', function(){ return typeof Worker; });
add('wasm', function(){ return typeof WebAssembly; });
add('subtle', function(){ return !!(crypto && crypto.subtle); });
add('notification', function(){ return typeof Notification === 'undefined' ? 'none' : Notification.permission; });
add('permissions', function(){ return typeof n.permissions; });
add('userAgentData', function(){ return typeof n.userAgentData; });
add('webgl', function(){
  var c = document.createElement('canvas'), g = c.getContext('webgl') || c.getContext('experimental-webgl');
  if (!g) return 'none';
  var d = g.getExtension('WEBGL_debug_renderer_info');
  return [g.getParameter(g.VERSION), d ? g.getParameter(d.UNMASKED_VENDOR_WEBGL) : '?', d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : '?'];
});
add('webgl2', function(){ return !!document.createElement('canvas').getContext('webgl2'); });
add('audioContext', function(){ return typeof (window.AudioContext || window.webkitAudioContext); });
add('chrome', function(){ return typeof window.chrome; });
add('safari', function(){ return typeof window.safari; });
add('ApplePay', function(){ return typeof window.ApplePaySession; });
add('gestureEvent', function(){ return typeof window.GestureEvent; });
r.forEach(log);
log('ended');
</script></body></html>
