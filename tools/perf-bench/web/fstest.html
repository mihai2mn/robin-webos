<!doctype html>
<html><head><meta charset="utf-8"><title>hls test</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 20px sans-serif; }
  header { position: sticky; top: 0; z-index: 1000; height: 70px; background: #264; display: flex; align-items: center; padding: 0 20px; }
  .wrap { padding: 20px; }
  .box { position: relative; overflow: hidden; width: 960px; height: 540px; background: #000; z-index: 1; }
  .box video { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: rgba(0,0,0,.5); display: flex; gap: 8px; align-items: center; padding: 0 10px; z-index: 2; }
  .bar button { font-size: 18px; }
  .filler { height: 600px; background: repeating-linear-gradient(#333 0 60px, #444 60px 120px); padding: 20px; }
  #st { position: fixed; right: 10px; bottom: 10px; background: #000c; padding: 6px; z-index: 5; font-size: 18px; }
</style></head>
<body>
<header>HLS Hardware Video Test</header>
<div class="wrap">
  <div class="box" id="box">
    <video id="v" playsinline controls></video>
    <div class="bar">
      <button id="play">play</button><button id="fs">fullscreen</button>
    </div>
  </div>
  <div class="filler">page content below video</div>
</div>
<div id="st">status</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  const v = document.getElementById('v'), st = document.getElementById('st');
  const q = new URLSearchParams(location.search);
  const src = q.get('src') || 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
  const hls = new Hls({ startLevel: -1 });
  hls.loadSource(src); hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    console.log('TEST manifest parsed levels=' + hls.levels.length);
    if (q.get('autoplay') === '1') {
      v.play().then(() => console.log('TEST autoplay ok muted=' + v.muted))
        .catch(e => {
          console.log('TEST unmuted play rejected ' + e.name + ', trying muted');
          v.muted = true;
          v.play().then(() => console.log('TEST muted autoplay ok')).catch(e2 => console.log('TEST muted play rejected ' + e2.name));
        });
    }
  });
  hls.on(Hls.Events.LEVEL_SWITCHED, (e, d) => console.log('TEST level switched ' + d.level + ' ' + (hls.levels[d.level] && hls.levels[d.level].height)));
  hls.on(Hls.Events.ERROR, (e, d) => console.log('TEST hls error ' + d.type + ' ' + d.details + ' fatal=' + d.fatal));
  document.getElementById('play').onclick = () => v.play().catch(e => console.log('TEST play rejected ' + e.name));
  document.getElementById('fs').onclick = () => document.getElementById('box').requestFullscreen();
  let tick = 0;
  setInterval(() => {
    const s = `t=${v.currentTime.toFixed(1)} rs=${v.readyState} ${v.videoWidth}x${v.videoHeight} paused=${v.paused} muted=${v.muted}`;
    st.textContent = s;
    if (++tick % 4 === 0) console.log('TEST status ' + s);
  }, 500);
</script>
</body></html>
